    <figcaption class="calligraphy-transcription" aria-label="第 20 页释文">
      <span class="calligraphy-column">之年。体拔浮华之</span>
      <span class="calligraphy-column">世。凝情定室。匿迹幽</span>
      <span class="calligraphy-column">巖。栖息三禅。巡游十</span>
      <span class="calligraphy-column">地，超六尘之境。独步</span>
      <span class="calligraphy-column">迦维。会一乘之旨。随</span>
      <span class="calligraphy-column">机化物。以中华之无</span>
      <span class="calligraphy-column">质。寻印度之真文。</span>
      <span class="calligraphy-column">远涉恒河。终期满</span>
      <span class="calligraphy-column">字。频登雪岭。更获</span>
    </figcaption>
  </figure>
  <figure class="calligraphy-page" style="--columns: 9">
    <img
      src="../assets/images/书法字帖/怀仁集王羲之圣教序/21.png"
      alt="怀仁集王羲之圣教序第 21 页"
      width="3127"
      height="2137"
      loading="lazy"
      decoding="async"
    >
    <figcaption class="calligraphy-transcription" aria-label="第 21 页释文">
      <span class="calligraphy-column">半珠。问道法还。十</span>
      <span class="calligraphy-column">有七载。备通释典。</span>
      <span class="calligraphy-column">利物为心。以贞观十</span>
      <span class="calligraphy-column">九年九月六日奉。</span>
      <span class="calligraphy-column">敕于弘福寺。翻译</span>
      <span class="calligraphy-column">圣教要文凡六百</span>
      <span class="calligraphy-column">五十七部。引大海之</span>
      <span class="calligraphy-column">法流。洗尘劳而不</span>
      <span class="calligraphy-column">竭。传智灯之长焰。</span>
    </figcaption>
  </figure>
  <figure class="calligraphy-page" style="--columns: 9">
    <img
      src="../assets/images/书法字帖/怀仁集王羲之圣教序/22.png"
      alt="怀仁集王羲之圣教序第 22 页"
      width="3127"
      height="2137"
      loading="lazy"
      decoding="async"
    >
    <figcaption class="calligraphy-transcription" aria-label="第 22 页释文">
      <span class="calligraphy-column">皎幽闇而恒明。自非</span>
      <span class="calligraphy-column">久值胜缘。何以显</span>
      <span class="calligraphy-column">扬斯旨。所谓法相常</span>
      <span class="calligraphy-column">住。齐三光之明。</span>
      <span class="calligraphy-column">我皇福臻。同二仪</span>
      <span class="calligraphy-column">之固。伏见御制。众经</span>
      <span class="calligraphy-column">论序。照古腾今。理</span>
      <span class="calligraphy-column">含金石之声。文抱</span>
      <span class="calligraphy-column">风云之润。治辄以轻</span>
    </figcaption>
  </figure>
  <figure class="calligraphy-page" style="--columns: 9">
    <img
      src="../assets/images/书法字帖/怀仁集王羲之圣教序/23.png"
      alt="怀仁集王羲之圣教序第 23 页"
      width="3127"
      height="2137"
      loading="lazy"
      decoding="async"
    >
    <figcaption class="calligraphy-transcription" aria-label="第 23 页释文">
      <span class="calligraphy-column">尘足岳。坠露添流。</span>
      <span class="calligraphy-column">略举大纲。以为斯记。</span>
      <span class="calligraphy-column">治素无才学。性不</span>
      <span class="calligraphy-column">聪敏。内典诸文。殊未</span>
      <span class="calligraphy-column">观览。所作论序。鄙</span>
      <span class="calligraphy-column">拙尤繁。忽见来书。</span>
      <span class="calligraphy-column">褒扬赞述。抚躬自</span>
      <span class="calligraphy-column">省。惭悚交并。劳师</span>
      <span class="calligraphy-column">等远臻。深以为愧。</span>
    </figcaption>
  </figure>
  <figure class="calligraphy-page" style="--columns: 9">
    <img
      src="../assets/images/书法字帖/怀仁集王羲之圣教序/24.png"
      alt="怀仁集王羲之圣教序第 24 页"
      width="3127"
      height="2137"
      loading="lazy"
      decoding="async"
    >
    <figcaption class="calligraphy-transcription" aria-label="第 24 页释文">
      <span class="calligraphy-column">贞观廿二年八月</span>
      <span class="calligraphy-column">三日内府。</span>
      <span class="calligraphy-column">般若波羅蜜多心經</span>
      <span class="calligraphy-column">沙门玄奘奉诏譯</span>
      <span class="calligraphy-column">觀自在菩薩。行深</span>
      <span class="calligraphy-column">般若波羅蜜多時。</span>
      <span class="calligraphy-column">照見五蘊皆空。度一</span>
      <span class="calligraphy-column">切苦厄。舍利子。色</span>
      <span class="calligraphy-column">不異空。空不異色。</span>
    </figcaption>
  </figure>
  <figure class="calligraphy-page" style="--columns: 9">
    <img
      src="../assets/images/书法字帖/怀仁集王羲之圣教序/25.png"
      alt="怀仁集王羲之圣教序第 25 页"
      width="3127"
      height="2137"
      loading="lazy"
      decoding="async"
    >
    <figcaption class="calligraphy-transcription" aria-label="第 25 页释文">
      <span class="calligraphy-column">色即是空。空即是</span>
      <span class="calligraphy-column">色。受想行識亦復</span>
      <span class="calligraphy-column">如是。舍利子。是諸法</span>
      <span class="calligraphy-column">空相。不生不滅。不垢</span>
      <span class="calligraphy-column">不淨不增不減。是</span>
      <span class="calligraphy-column">故空中。無色。無受</span>
      <span class="calligraphy-column">想行識。無眼耳鼻</span>
      <span class="calligraphy-column">舌身意。無色聲</span>
      <span class="calligraphy-column">香味觸法。無眼界。</span>
    </figcaption>
  </figure>
  <figure class="calligraphy-page" style="--columns: 9">
    <img
      src="../assets/images/书法字帖/怀仁集王羲之圣教序/26.png"
      alt="怀仁集王羲之圣教序第 26 页"
      width="3127"
      height="2137"
      loading="lazy"
      decoding="async"
    >
    <figcaption class="calligraphy-transcription" aria-label="第 26 页释文">
      <span class="calligraphy-column">乃至無意識界。無無</span>
      <span class="calligraphy-column">明。亦無無明盡。乃至</span>
      <span class="calligraphy-column">無老死。亦無老死</span>
      <span class="calligraphy-column">盡。無苦集滅道。無</span>
      <span class="calligraphy-column">智亦無得。以無所得</span>
      <span class="calligraphy-column">故。菩提薩埵。依般</span>
      <span class="calligraphy-column">若波羅蜜多故。心無</span>
      <span class="calligraphy-column">罣礙。無罣礙故。無有</span>
      <span class="calligraphy-column">恐怖。遠離顛倒夢</span>
    </figcaption>
  </figure>
  <figure class="calligraphy-page" style="--columns: 9">
    <img
      src="../assets/images/书法字帖/怀仁集王羲之圣教序/27.png"
      alt="怀仁集王羲之圣教序第 27 页"
      width="3127"
      height="2137"
      loading="lazy"
      decoding="async"
    >
    <figcaption class="calligraphy-transcription" aria-label="第 27 页释文">
      <span class="calligraphy-column">想。究竟涅槃。三世諸</span>
      <span class="calligraphy-column">佛。依般若波羅蜜</span>
      <span class="calligraphy-column">多故。得阿耨多羅</span>
      <span class="calligraphy-column">三藐三菩提。故知般</span>
      <span class="calligraphy-column">若波羅蜜多。是大</span>
      <span class="calligraphy-column">神咒。是大明咒是無</span>
      <span class="calligraphy-column">上咒。是無等等咒。</span>
      <span class="calligraphy-column">能除一切苦。真實不</span>
      <span class="calligraphy-column">虛故。說般若波羅</span>
    </figcaption>
  </figure>
  <figure class="calligraphy-page" style="--columns: 9">
    <img
      src="../assets/images/书法字帖/怀仁集王羲之圣教序/28.png"
      alt="怀仁集王羲之圣教序第 28 页"
      width="3127"
      height="2137"
      loading="lazy"
      decoding="async"
    >
    <figcaption class="calligraphy-transcription" aria-label="第 28 页释文">
      <span class="calligraphy-column">蜜多咒即說咒曰</span>
      <span class="calligraphy-column">揭帝揭帝</span>
      <span class="calligraphy-column">般羅揭帝</span>
      <span class="calligraphy-column">般羅僧揭帝</span>
      <span class="calligraphy-column">菩提莎訶</span>
      <span class="calligraphy-column">般若多心經</span>
      <span class="calligraphy-column">太子太傅尚书左仆</span>
      <span class="calligraphy-column">射燕国公</span>
      <span class="calligraphy-column">于志宁</span>
    </figcaption>
  </figure>
  <figure class="calligraphy-page" style="--columns: 9">
    <img
      src="../assets/images/书法字帖/怀仁集王羲之圣教序/29.png"
      alt="怀仁集王羲之圣教序第 29 页"
      width="3127"
      height="2137"
      loading="lazy"
      decoding="async"
    >
    <figcaption class="calligraphy-transcription" aria-label="第 29 页释文">
      <span class="calligraphy-column">中书令南阳县开国</span>
      <span class="calligraphy-column">男来济</span>
      <span class="calligraphy-column">礼部尚书高阳县</span>
      <span class="calligraphy-column">开国男</span>
      <span class="calligraphy-column">许敬宗</span>
      <span class="calligraphy-column">守黄门侍郎兼左</span>
      <span class="calligraphy-column">庶子薛元超</span>
      <span class="calligraphy-column">守中书侍郎兼右</span>
      <span class="calligraphy-column">庶子李义</span>
    </figcaption>
  </figure>
  <figure class="calligraphy-page" style="--columns: 9">
    <img
      src="../assets/images/书法字帖/怀仁集王羲之圣教序/30.png"
      alt="怀仁集王羲之圣教序第 30 页"
      width="3127"
      height="2137"
      loading="lazy"
      decoding="async"
    >
    <figcaption class="calligraphy-transcription" aria-label="第 30 页释文">
      <span class="calligraphy-column">府等奉敕润色</span>
      <span class="calligraphy-column">咸亨三年十二月八日京</span>
      <span class="calligraphy-column">城法侣建立文</span>
      <span class="calligraphy-column">林郎诸葛神力勒石</span>

    </figcaption>
  </figure>
